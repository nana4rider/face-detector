<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Detector</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <h1 class="mb-4">Face Detector</h1>
      <form action="/detect" method="post" enctype="multipart/form-data" class="card p-4 shadow-sm">
        <div class="mb-3">
          <label for="file" class="form-label">画像ファイル:</label>
          <input type="file" name="file" id="file" accept="image/*" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="scoreThreshold" class="form-label">検出スコア閾値 (0.0 - 1.0):</label>
          <input type="number" name="scoreThreshold" id="scoreThreshold" step="0.1" min="0" max="1" value="0.5" class="form-control">
        </div>
        <div class="mb-3">
          <label for="minSize" class="form-label">最小サイズ (ピクセル):</label>
          <input type="number" name="minSize" id="minSize" value="0" min="0" class="form-control">
        </div>
        <div class="row mb-3">
          <div class="col">
            <label for="startX" class="form-label">切り抜き開始 X (省略可能):</label>
            <input type="number" name="startX" id="startX" class="form-control">
          </div>
          <div class="col">
            <label for="startY" class="form-label">切り抜き開始 Y (省略可能):</label>
            <input type="number" name="startY" id="startY" class="form-control">
          </div>
        </div>
        <div class="row mb-3">
          <div class="col">
            <label for="endX" class="form-label">切り抜き終了 X (省略可能):</label>
            <input type="number" name="endX" id="endX" class="form-control">
          </div>
          <div class="col">
            <label for="endY" class="form-label">切り抜き終了 Y (省略可能):</label>
            <input type="number" name="endY" id="endY" class="form-control">
          </div>
        </div>
        <button type="submit" class="btn btn-primary">検出</button>
      </form>
      <div id="result" class="mt-4"></div>
    </main>
    <script>
      const form = document.querySelector("form");
      const result = document.getElementById("result");
      let imageUrl;

      for (const element of form.elements) {
        if (element.name && element.type !== "file") {
          const saved = localStorage.getItem(`face-detector:${element.name}`);
          if (saved !== null) element.value = saved;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        for (const [key, value] of formData) {
          if (typeof value === "string") {
            localStorage.setItem(`face-detector:${key}`, value);
          }
        }

        try {
          const startedAt = performance.now();
          const response = await fetch(form.action, {method: "POST", body: formData});
          const elapsed = Math.round(performance.now() - startedAt);
          if (!response.ok) {
            const error = await response.json();
            result.innerHTML = `<div class="alert alert-danger" role="alert"></div>`;
            result.firstElementChild.textContent = `エラー (${response.status}): ${error.error}`;
            return;
          }

          if (imageUrl) URL.revokeObjectURL(imageUrl);
          imageUrl = URL.createObjectURL(await response.blob());
          result.replaceChildren();
          const image = document.createElement("img");
          image.className = "img-fluid";
          image.src = imageUrl;
          image.alt = "Detected Face";
          const dimensions = document.createElement("p");
          dimensions.textContent = `Width: ${response.headers.get("X-Image-Width")}px, Height: ${response.headers.get("X-Image-Height")}px`;
          const timing = document.createElement("p");
          timing.textContent = `Elapsed Time: ${elapsed} ms`;
          result.append(image, dimensions, timing);
        } catch (error) {
          result.innerHTML = `<div class="alert alert-danger" role="alert"></div>`;
          result.firstElementChild.textContent = `エラー: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
