name: Test

on:
  workflow_call:
  pull_request:
    branches:
      - main

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.0
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.0
          args: format --check
