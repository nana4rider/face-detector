[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "face-detector"
version = "3.0.0"
description = "画像から最も信頼度の高い顔を検出して切り抜くAPI"
readme = "README.md"
requires-python = ">=3.12"
license = "ISC"
dependencies = [
    "fastapi",
    "mediapipe==0.10.35",
    "numpy",
    "opencv-contrib-python==5.0.0.93",
    "python-multipart",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4,<5",
    "ruff==0.16.0",
]

[tool.setuptools.packages.find]
include = ["face_detector*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
